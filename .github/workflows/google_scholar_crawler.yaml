name: Get Citation Data

on:
  page_build:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install and check dependencies
      run: |
        python -m pip install -r google_scholar_crawler/requirements.txt
        python -m pip check
        python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"
    - name: Fetch citation data
      id: fetch
      working-directory: google_scholar_crawler
      timeout-minutes: 3
      run: |
        if timeout --kill-after=5s 120s python -u main.py; then
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Google Scholar citation data fetched successfully." >> "$GITHUB_STEP_SUMMARY"
        else
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 75 ]; then
            echo "::warning::Google Scholar is unavailable or timed out. Keeping the previous citation data; the next scheduled run will retry."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Google Scholar update skipped: the service was unavailable or timed out. Existing citation data was not changed. The next scheduled run will retry." >> "$GITHUB_STEP_SUMMARY"
          else
            exit "$status"
          fi
        fi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    - name: Check out citation data branch
      if: steps.fetch.outputs.updated == 'true'
      uses: actions/checkout@v7
      with:
        ref: google-scholar-stats
        path: citation-data
    - name: Publish citation data
      if: steps.fetch.outputs.updated == 'true'
      run: |
        cp google_scholar_crawler/results/*.json citation-data/
        cd citation-data
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add gs_data.json gs_data_shieldsio.json
        if git diff --cached --quiet; then
          echo "Citation data is unchanged."
          exit 0
        fi
        git commit -m "Updated Citation Data"
        git push origin HEAD:google-scholar-stats
